
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>দারুল হিকমা মাদ্রাসা</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f6f4;color:#18352c}
header{background:#075c43;color:white;padding:22px 15px;text-align:center}
header h2{margin:0 0 7px;font-size:21px}
header p{margin:0;font-size:13px}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px}
nav button{border:0;border-radius:9px;background:#dcece5;color:#075c43;padding:12px 5px;font-weight:bold}
nav button.active{background:#075c43;color:white}
main{padding:12px}
.panel{background:white;padding:16px;border-radius:12px;margin-bottom:13px;box-shadow:0 2px 8px #0000000b}
h3{margin:0 0 14px;color:#075c43}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#e6f3ed;padding:17px;border-radius:10px}
.stat b{display:block;font-size:25px;color:#075c43}
.stat span{font-size:13px}
input,select,textarea{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #cbd8d1;border-radius:7px;font-size:15px}
label{font-size:14px;font-weight:bold}
.action{background:#08734f;color:white;border:0;padding:12px 17px;border-radius:7px;font-weight:bold}
.delete{background:#b83232;color:white;border:0;padding:7px 10px;border-radius:6px}
.item{border-bottom:1px solid #e4e9e5;padding:12px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.small{font-size:12px;color:#64766d}
footer{text-align:center;padding:20px;color:#718078;font-size:12px}
</style>
</head>
<body>

<header>
<h2>দারুল হিকমা খানম নূরানী ও হাফেজিয়া মাদ্রাসা</h2>
<p>মাদ্রাসা ম্যানেজমেন্ট সিস্টেম</p>
</header>

<nav id="menu"></nav>
<main id="app"></main>
<footer>আল্লাহ আমাদের দ্বীনি খেদমত কবুল করুন।</footer>

<script>
const modules={
students:{title:"শিক্ষার্থী ব্যবস্থাপনা",fields:[
["name","শিক্ষার্থীর নাম"],["father","পিতার নাম"],["class","জামাত/শ্রেণি"],["phone","মোবাইল নম্বর"],["address","ঠিকানা"]]},
teachers:{title:"শিক্ষক ও কর্মচারী",fields:[
["name","নাম"],["designation","পদবি"],["phone","মোবাইল নম্বর"],["salary","মাসিক বেতন"]]},
attendance:{title:"দৈনিক উপস্থিতি",fields:[
["name","শিক্ষার্থীর নাম"],["date","তারিখ","date"],["status","উপস্থিতি","select"]]},
fees:{title:"বেতন ও ফি",fields:[
["name","শিক্ষার্থীর নাম"],["month","মাস"],["amount","টাকার পরিমাণ"],["date","জমার তারিখ","date"]]},
results:{title:"পরীক্ষার ফলাফল",fields:[
["name","শিক্ষার্থীর নাম"],["exam","পরীক্ষার নাম"],["subject","বিষয়"],["marks","প্রাপ্ত নম্বর"]]},
accounts:{title:"আয়-ব্যয়ের হিসাব",fields:[
["type","হিসাবের ধরন","select"],["details","বিবরণ"],["amount","টাকার পরিমাণ"],["date","তারিখ","date"]]},
notices:{title:"নোটিশ বোর্ড",fields:[
["title","নোটিশের শিরোনাম"],["details","নোটিশের বিবরণ"],["date","তারিখ","date"]]}
};

let current="home";
let db=JSON.parse(localStorage.getItem("madrasaDB")||"{}");
function save(){localStorage.setItem("madrasaDB",JSON.stringify(db))}
function count(k){return (db[k]||[]).length}

const labels={home:"হোম",students:"শিক্ষার্থী",teachers:"শিক্ষক",attendance:"উপস্থিতি",fees:"বেতন",results:"ফলাফল",accounts:"হিসাব",notices:"নোটিশ",reports:"রিপোর্ট"};

function show(key){
current=key;
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.key===key));
let a=document.getElementById("app");

if(key==="home"){
a.innerHTML=`<div class="panel"><h3>আসসালামু আলাইকুম</h3>মাদ্রাসা ম্যানেজমেন্ট ড্যাশবোর্ডে স্বাগতম।</div>
<div class="cards">
${["students","teachers","attendance","fees","results","notices"].map(k=>`<div class="stat"><b>${count(k)}</b><span>${labels[k]} রেকর্ড</span></div>`).join("")}
</div>`;
return;
}
if(key==="reports"){
a.innerHTML=`<div class="panel"><h3>রিপোর্ট</h3>
${Object.keys(modules).map(k=>`<div class="item"><span>${modules[k].title}</span><b>${count(k)}</b></div>`).join("")}
</div>`;
return;
}
let m=modules[key];
let fields=m.fields.map(f=>`<label>${f[1]}</label>${
f[2]==="select"?
`<select name="${f[0]}" required><option value="">নির্বাচন করুন</option>${(f[0]==="status"?["উপস্থিত","অনুপস্থিত","ছুটি"]:["আয়","ব্যয়"]).map(x=>`<option>${x}</option>`).join("")}</select>`:
`<input name="${f[0]}" type="${f[2]||"text"}" placeholder="${f[1]}" required>`
}`).join("");

a.innerHTML=`<div class="panel"><h3>${m.title}</h3>
<form id="entryForm">${fields}<button class="action" type="submit">তথ্য সংরক্ষণ করুন</button></form>
</div><div class="panel"><h3>সংরক্ষিত তথ্য (${count(key)})</h3><div id="records"></div></div>`;

document.getElementById("entryForm").onsubmit=e=>{
e.preventDefault();
let data=Object.fromEntries(new FormData(e.target).entries());
if(!db[key])db[key]=[];
db[key].push({...data,id:Date.now()});
save();show(key);
};
renderRecords(key);
}

function renderRecords(key){
let box=document.getElementById("records");
if(!box)return;
let rows=db[key]||[];
box.innerHTML=rows.length?rows.slice().reverse().map(r=>
`<div class="item"><div>${modules[key].fields.map(f=>`<div><b>${f[1]}:</b> ${escapeHTML(r[f[0]]||"")}</div>`).join("")}</div>
<button class="delete" onclick="removeRecord('${key}',${r.id})">মুছুন</button></div>`
).join(""):"<p class='small'>এখনো কোনো তথ্য যোগ করা হয়নি।</p>";
}
function removeRecord(key,id){
if(confirm("তথ্যটি মুছে ফেলতে চান?")){
db[key]=(db[key]||[]).filter(x=>x.id!==id);
save();show(key);
}
}
function escapeHTML(s){
return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
document.getElementById("menu").innerHTML=Object.entries(labels).map(([k,v])=>
`<button data-key="${k}" onclick="show('${k}')">${v}</button>`).join("");
show("home");
</script>
</body>
</html>
